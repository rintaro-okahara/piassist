[project]
name = "piassist"
version = "0.1.0"
description = "Annotate sharp and flat notes in vector music-score PDFs"
authors = [
    {name = "Rinn5",email = "kirin5534@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.12.0.88,<5.0.0.0",
    "numpy>=2,<2.3.0",
    "pymupdf>=1.26.0,<2",
]

[project.scripts]
piassist = "piassist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
